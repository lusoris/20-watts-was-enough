name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    env:
      PAGES_BASE_PATH: /
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Use npm 12.0.2
        run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the closed source-publication allowlist
        run: npm run validate:sources
      - name: Test source-publication tamper resistance
        # This suite is a single file, so the default process-isolated runner
        # has identical test semantics in CI.
        run: node --test scripts/source-boundary.test.mjs
      - name: Test, build, and validate the publication artifact
        run: npm run test:github-pages
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-github-pages
          include-hidden-files: true

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

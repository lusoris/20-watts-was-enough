name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title must use Conventional Commits: <type>(<scope>): <description>"
            exit 1
          fi

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Reject a code-shape baseline reset
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}:scripts/code-shape-baseline.json" 2>/dev/null; then
            mkdir -p build/policy
            git show "${BASE_SHA}:scripts/code-shape-baseline.json" > build/policy/base-code-shape-baseline.json
            node scripts/audit-code-shape.mjs --baseline build/policy/base-code-shape-baseline.json
          else
            echo "No prior code-shape baseline exists at $BASE_SHA; the tracked baseline remains authoritative."
          fi
      - name: Run the authoritative repository check
        run: npm run check

  github-pages:
    name: GitHub Pages edition
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test the public portal, book, and publication artifact
        run: npm run test:github-pages

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  ci-success:
    name: CI success
    if: always()
    needs: [pr-title, quality, github-pages, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "gate results: $RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*)
              echo "::error::one or more CI gates failed or were cancelled: $RESULTS"
              exit 1
              ;;
          esac

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact-plan:
    name: CI impact plan
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      container: ${{ steps.plan.outputs.container }}
      dependency: ${{ steps.plan.outputs.dependency }}
      go: ${{ steps.plan.outputs.go }}
      release: ${{ steps.plan.outputs.release }}
      renderer: ${{ steps.plan.outputs.renderer }}
      research: ${{ steps.plan.outputs.research }}
      site: ${{ steps.plan.outputs.site }}
      workstation_any: ${{ steps.plan.outputs.workstation_any }}
      workstation_matrix: ${{ steps.plan.outputs.workstation_matrix }}
    steps:
      - name: Check out the complete comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Validate and project the bounded CI plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            go -C tooling run ./cmd/20w ci plan --root .. \
              --base "$BASE_SHA" --head "$HEAD_SHA" --json \
              > build/ci-impact-plan.json
          elif [[ "$EVENT_NAME" == "push" ]]; then
            zero_sha=0000000000000000000000000000000000000000
            valid_commit() {
              local sha="$1"
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${sha}^{commit}" 2>/dev/null
            }
            if [[ "$BEFORE_SHA" != "$zero_sha" ]] \
              && valid_commit "$BEFORE_SHA" \
              && valid_commit "$CURRENT_SHA" \
              && git merge-base --is-ancestor "$BEFORE_SHA" "$CURRENT_SHA"; then
              go -C tooling run ./cmd/20w ci plan --root .. \
                --base "$BEFORE_SHA" --head "$CURRENT_SHA" --json \
                > build/ci-impact-plan.json
            else
              echo "::notice::Main-push comparison is unavailable; running the fail-closed full plan."
              go -C tooling run ./cmd/20w ci plan --root .. --full --json \
                > build/ci-impact-plan.json
            fi
          else
            go -C tooling run ./cmd/20w ci plan --root .. --full --json \
              > build/ci-impact-plan.json
          fi
          test -s build/ci-impact-plan.json
          go -C tooling run ./cmd/20w ci project \
            < build/ci-impact-plan.json >> "$GITHUB_OUTPUT"

  quality-full:
    name: Full quality
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Use the locked Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install the locked scientific runtime
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements-ci.txt
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Reject a code-shape baseline reset
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}:scripts/code-shape-baseline.json" 2>/dev/null; then
            mkdir -p build/policy
            git show "${BASE_SHA}:scripts/code-shape-baseline.json" > build/policy/base-code-shape-baseline.json
            node scripts/audit-code-shape.mjs --baseline build/policy/base-code-shape-baseline.json
          else
            echo "No prior code-shape baseline exists at $BASE_SHA; the tracked baseline remains authoritative."
          fi
      - name: Run the full quality check without workstation tests
        run: npm run check:full-without-workstation
      - name: Fuzz the untrusted JSON boundary
        run: go -C tooling test ./internal/strictjson -run '^$' -fuzz '^FuzzValidate$' -fuzztime=30s -fuzzminimizetime=5s -parallel=2 -timeout=2m

  impact-common:
    name: Impact common
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'impact'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Run common impact checks
        run: npm run check:impact-common

  lane-go:
    name: Go lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.go == 'true'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Test and vet Go packages
        run: go -C tooling test ./... && go -C tooling vet ./...

  lane-release:
    name: Release lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.release == 'true'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Run release checks
        run: npm run check:lane-release

  pdf-renderer-reproducibility:
    name: PDF renderer reproducibility
    needs: impact-plan
    if: needs.impact-plan.outputs.renderer == 'true'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Set up the locked PDF Docker Buildx client
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8,network=host
      - name: Rebuild the final PDF renderer twice without cache
        run: >-
          go -C tooling run ./cmd/20w publication verify-pdf-reproducibility
          --root .. --ref main
          --receipt build/evidence/pdf-renderer-reproducibility.json
      - name: Retain the PDF renderer reproducibility evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pdf-renderer-reproducibility
          path: |-
            build/evidence/pdf-renderer-reproducibility.json
            build/evidence/pdf-renderer-reproducibility-mismatch
          if-no-files-found: error
          retention-days: 30

  lane-research:
    name: Research lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.research == 'true'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Run research checks
        run: npm run check:lane-research

  lane-site:
    name: Site lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.site == 'true'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Run site checks
        run: npm run check:lane-site

  workstation-core:
    name: Workstation core
    needs: impact-plan
    if: needs.impact-plan.outputs.workstation_any == 'true'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Validate the workstation inventory and core
        run: npm run validate:workstation && npm run test:workstation:core

  workstation-artifacts:
    name: Workstation test (${{ matrix.artifact }})
    needs: impact-plan
    if: needs.impact-plan.outputs.workstation_any == 'true'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        artifact: ${{ fromJSON(needs.impact-plan.outputs.workstation_matrix) }}
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the locked Python runtime for Fixture 019
        if: matrix.artifact == 'fixture-019'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install the locked scientific runtime for Fixture 019
        if: matrix.artifact == 'fixture-019'
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements-ci.txt
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Run the allowlisted artifact test script
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          case "$ARTIFACT" in
            candidate-010) npm run test:workstation:candidate-010 ;;
            fixture-007) npm run test:workstation:fixture-007 ;;
            fixture-012) npm run test:workstation:fixture-012 ;;
            fixture-019) npm run test:workstation:fixture-019 ;;
            fixture-022) npm run test:workstation:fixture-022 ;;
            fixture-023) npm run test:workstation:fixture-023 ;;
            fixture-024) npm run test:workstation:fixture-024 ;;
            fixture-025) npm run test:workstation:fixture-025 ;;
            fixture-026-shard-1) npm run test:workstation:fixture-026:shard-1 ;;
            fixture-026-shard-2) npm run test:workstation:fixture-026:shard-2 ;;
            fixture-026-shard-3) npm run test:workstation:fixture-026:shard-3 ;;
            fixture-026-shard-4) npm run test:workstation:fixture-026:shard-4 ;;
            fixture-026-shard-5) npm run test:workstation:fixture-026:shard-5 ;;
            fixture-026-shard-6) npm run test:workstation:fixture-026:shard-6 ;;
            fixture-026-shard-7) npm run test:workstation:fixture-026:shard-7 ;;
            fixture-027) npm run test:workstation:fixture-027 ;;
            fixture-029-shard-1) npm run test:workstation:fixture-029:shard-1 ;;
            fixture-029-shard-2) npm run test:workstation:fixture-029:shard-2 ;;
            *) echo "::error::unallowlisted workstation artifact: $ARTIFACT"; exit 1 ;;
          esac

  container-smoke:
    name: Container smoke paths
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || needs.impact-plan.outputs.container == 'true'
    runs-on: arc-cauda-lusoris-20-watts
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27 for closed image contexts
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8,network=host
      - name: Build the static 20w image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tooling/Dockerfile
          load: true
          push: false
          tags: 20w-tooling:test
          build-args: |
            IMAGE_VERSION=development
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_TIMESTAMP=unknown
          cache-from: type=gha,scope=20w-tooling-image
          cache-to: type=gha,mode=max,scope=20w-tooling-image
      - name: Verify the static 20w image against the mounted repository
        run: |
          set -euo pipefail
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            20w-tooling:test version --json
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            20w-tooling:test validate docs --root /repo
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            20w-tooling:test experiment list --root /repo --json
      - name: Package the closed Fixture 007 runtime context
        run: go -C tooling run ./cmd/20w experiment package-node-image --root .. --artifact fixture-007 --output ../build/container-contexts/fixture-007
      - name: Build the Fixture 007 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/container-contexts/fixture-007
          file: experiments/workstation/Dockerfile.node-artifact
          load: true
          push: false
          tags: 20w-fixture-007:test
          build-args: |
            EXPERIMENT_ARTIFACT=fixture-007
            IMAGE_NAME=ghcr.io/${{ github.repository }}-fixture-007
            IMAGE_VERSION=development
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=fixture-007-image
          cache-to: type=gha,mode=max,scope=fixture-007-image
      - name: Execute the bounded Fixture 007 smoke path
        run: |
          set -euo pipefail
          node_version="$(docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node 20w-fixture-007:test --version)"
          if [[ "$node_version" != "v26.8.1" ]]; then
            echo "::error::Fixture 007 Node.js runtime is $node_version, want v26.8.1"
            exit 1
          fi
          volume="20w-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fixture-007"
          docker volume create "$volume"
          trap 'docker volume rm "$volume" >/dev/null' EXIT
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/results" \
            20w-fixture-007:test smoke --profile smoke --output /workspace/results/ci-fixture-007
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/results" \
            20w-fixture-007:test analyze --output /workspace/results/ci-fixture-007
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/results" \
            20w-fixture-007:test validate --output /workspace/results/ci-fixture-007
      - name: Package the closed Fixture 019 runtime context
        run: go -C tooling run ./cmd/20w experiment package-node-image --root .. --artifact fixture-019 --output ../build/container-contexts/fixture-019
      - name: Build the Fixture 019 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/container-contexts/fixture-019
          file: experiments/workstation/fixture-019/Dockerfile
          load: true
          push: false
          tags: 20w-fixture-019:test
          build-args: |
            IMAGE_NAME=ghcr.io/${{ github.repository }}-fixture-019
            IMAGE_VERSION=development
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=fixture-019-image
          cache-to: type=gha,mode=max,scope=fixture-019-image
      - name: Verify the locked runtimes and smoke profile
        run: |
          set -euo pipefail
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint sh 20w-fixture-019:test -c \
            'test "$(node --version)" = "v26.8.1" && test "$(python --version)" = "Python 3.14.7" && python -c "import numpy; assert numpy.__version__ == \"2.5.2\""'
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            20w-fixture-019:test prepare --profile smoke
      - name: Execute the bounded Fixture 019 smoke path
        run: |
          set -euo pipefail
          volume="20w-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fixture-019"
          docker volume create "$volume"
          trap 'docker volume rm "$volume" >/dev/null' EXIT
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/workspace/results" \

# Repository label source. The labels are applied through GitHub and consumed
# by the issue forms and the metadata-only path labeler.
- name: "type:feat"
  color: "0e8a16"
  description: "New capability, mechanism, or research surface"
- name: "type:fix"
  color: "d73a4a"
  description: "Correction or defect repair"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation-only change"
- name: "type:chore"
  color: "fef2c0"
  description: "Maintenance or cleanup"
- name: "type:refactor"
  color: "c5def5"
  description: "Structure change without intended behavior change"
- name: "type:test"
  color: "fbca04"
  description: "Test, fixture, or validation change"
- name: "type:ci"
  color: "7057ff"
  description: "Continuous-integration or automation change"
- name: "type:build"
  color: "5319e7"
  description: "Build, generation, or release infrastructure"

- name: "severity:p0"
  color: "b60205"
  description: "Critical security, evidence-integrity, or publication-boundary failure"
- name: "severity:p1"
  color: "d93f0b"
  description: "High-priority correctness or authority failure"
- name: "severity:p2"
  color: "fbca04"
  description: "Normal priority"
- name: "severity:p3"
  color: "c2e0c6"
  description: "Low-priority improvement"

- name: "status:needs-triage"
  color: "ededed"
  description: "Awaiting initial classification"
- name: "status:blocked"
  color: "e99695"
  description: "Blocked on evidence, authority, access, or another dependency"
- name: "status:in-progress"
  color: "1d76db"
  description: "Actively being worked on"
- name: "status:waiting-on-author"
  color: "fbca04"
  description: "Awaiting information or changes from the author"
- name: "status:wontfix"
  color: "555555"
  description: "Closed deliberately with rationale"

- name: "area:evidence"
  color: "0052cc"
  description: "Claims, references, provenance, audits, or evidence status"
- name: "area:research"
  color: "0e8a16"
  description: "Concept synthesis or cross-domain principle work"
- name: "area:experiment"
  color: "b60205"
  description: "Candidate, fixture, workstation, or result-authority work"
- name: "area:math"
  color: "5319e7"
  description: "Equations, derivations, units, or quantitative plots"
- name: "area:site"
  color: "1d76db"
  description: "Portal, reader, Pages, accessibility, or rendering"
- name: "area:publication"
  color: "0366d6"
  description: "Book, PDF, release artifact, or publication boundary"
- name: "area:governance"
  color: "6f42c1"
  description: "Policy, ownership, contribution, licensing, or decisions"
- name: "area:security"
  color: "b60205"
  description: "Security, privacy, secrets, or supply-chain boundary"
- name: "area:ci"
  color: "7057ff"
  description: "Workflow, validator, dependency, or release automation"

- name: "dependencies"
  color: "0366d6"
  description: "Dependency or lockfile update"
- name: "breaking-change"
  color: "b60205"
  description: "Backwards-incompatible public contract change"
- name: "good-first-issue"
  color: "7057ff"
  description: "Bounded entry point for a new contributor"
- name: "help-wanted"
  color: "008672"
  description: "Maintainer welcomes outside implementation"
- name: "security"
  color: "b60205"
  description: "Public security-process work without confidential details"
- name: "javascript"
  color: "f1e05a"
  description: "JavaScript dependency update"

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">64 seed labels are only two opaque handle maps</title>
  <desc id="desc">Exact mapping produced by the checked-in F-026 initialization-ID and opaque-state-permutation functions at the displayed background and time constant. The three colored regions are procedural information cuts. The seed axis selects one of two handle mappings and does not instantiate independently sampled systems, so the graphic carries no effective-sample-size, comparison, performance, or energy result.</desc>

  <text x="660" y="410" fill="#ffb04a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">SAME ERROR FUNCTION · DIFFERENT QUESTION</text>
  <text x="660" y="437" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="13">Peak magnitude stays exactly 1.</text>
  <text x="660" y="461" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="13">Its duration shrinks with epsilon.</text>
  <text x="660" y="488" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="11">A fixed-step sampler can miss both facts.</text>
  <text x="576" y="617" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">fast/slow ratio epsilon · logarithmic</text>
  <text x="28" y="353" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle" transform="rotate(-90 28 353)">dimensionless discrepancy norm</text>

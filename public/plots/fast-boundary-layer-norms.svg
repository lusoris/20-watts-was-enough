<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">A fixed peak can disappear in an RMS score</title>
  <desc id="desc">Exact norms of the displayed dimensionless boundary-layer function on a one-second window. It demonstrates why a shrinking-duration, order-one peak can retain a supremum-norm floor while its integrated RMS vanishes. It is a metric counterexample, not the biological model or a fit to the Skataric--Nikolaev--Sontag systems.</desc>
  <rect width="1100" height="660" rx="24" fill="#101c18"/>
  <rect x="36" y="30" width="272" height="30" rx="15" fill="#203b31" stroke="#3f6b5b"/>
  <text x="52" y="50" fill="#36d399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">EXACT NORM COUNTEREXAMPLE</text>
  <text x="54" y="94" fill="#fffaf0" font-family="Georgia, serif" font-size="32" font-weight="700">A fixed peak can disappear in an RMS score</text>
  <text x="54" y="123" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="14">e_epsilon(t)=exp(-t/(epsilon tau_s)); ||e||_infinity=1; RMS=sqrt(epsilon tau_s(1-exp(-2T/(epsilon tau_s)))/(2T)); tau_s=T=1 s</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc" data-layout="normal-hyperbolicity-boundary" data-theme="ember">
  <title id="title">The slow-manifold certificate collapses at a fold</title>
  <desc id="desc">Exact geometry of the dimensionless fold normal form on its attracting branch. It illustrates loss of normal hyperbolicity and is not a universal online threshold.</desc>
  <rect width="1180" height="760" fill="#24120d"/>
  <rect x="54" y="26" width="304.59999999999997" height="28" rx="14" fill="#48261b" stroke="#ffb44c"/>
  <text x="70" y="45" fill="#ffb44c" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.1">FOLD NORMAL FORM · EXACT GEOMETRY</text>
  <text x="54" y="78" fill="#fff8ee" font-family="Georgia, serif" font-size="30" font-weight="700">The slow-manifold certificate collapses at a fold</text>
  <text x="54" y="112" fill="#d6b8a7" font-family="Cascadia Mono, monospace" font-size="13">f(x,y)=y-x^2; x*(y)=sqrt(y); gamma=2 sqrt(y); |d x*/d y|=1/(2 sqrt(y))</text>
  <text x="1138" y="45" fill="#d6b8a7" font-family="Cascadia Mono, monospace" font-size="11" text-anchor="end">normal-hyperbolicity-boundary · no measurements</text>

  <text x="52" y="50" fill="#36d399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">MATHEMATICAL MODEL · ILLUSTRATIVE</text>
  <text x="54" y="94" fill="#fffaf0" font-family="Georgia, serif" font-size="32" font-weight="700">Finite-time adiabatic crossover</text>
  <text x="54" y="123" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="14">E/(CV^2) = gamma/x + ell*x + e_overhead</text>

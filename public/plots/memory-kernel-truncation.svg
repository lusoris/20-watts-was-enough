<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc" data-layout="memory-tail-contract" data-theme="violet">
  <title id="title">A finite memory window leaves a measurable tail</title>
  <desc id="desc">Exact normalized tail mass for a single exponential kernel. It visualizes a truncation contract, not a claim that real unresolved dynamics have one exponential timescale.</desc>
  <rect width="1180" height="760" fill="#171127"/>
  <rect x="54" y="26" width="321" height="28" rx="14" fill="#33244f" stroke="#c4a7ff"/>
  <text x="70" y="45" fill="#c4a7ff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.1">EXACT EXPONENTIAL TAIL · ANALYTICAL</text>
  <text x="54" y="78" fill="#fffaff" font-family="Georgia, serif" font-size="30" font-weight="700">A finite memory window leaves a measurable tail</text>
  <text x="54" y="112" fill="#c9bce0" font-family="Cascadia Mono, monospace" font-size="13">R(H) = integral_H^inf K(tau) d tau / integral_0^inf K(tau) d tau = exp(-H/tau_m)</text>
  <text x="1138" y="45" fill="#c9bce0" font-family="Cascadia Mono, monospace" font-size="11" text-anchor="end">memory-tail-contract · no measurements</text>
  <rect x="94" y="154" width="736" height="514" rx="16" fill="#261b3d" stroke="#594879" stroke-width="2"/>

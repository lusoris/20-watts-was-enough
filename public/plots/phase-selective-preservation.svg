<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Protection and release can oppose each other</title>
  <desc id="desc">Constructed reading aid for the phase-selective preservation hypothesis. The logistic factors and all parameter values are illustrative. The curve is not fitted to a biological system, medicinal product, software implementation, benchmark, workstation run, or energy measurement; every F-029 comparison remains NO_RESULT.</desc>
  <rect width="1100" height="660" rx="24" fill="#101c18"/>
  <rect x="36" y="30" width="399" height="30" rx="15" fill="#203b31" stroke="#3f6b5b"/>
  <text x="52" y="50" fill="#36d399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">HYPOTHETICAL RESPONSE MODEL · NO_RESULT</text>
  <text x="54" y="94" fill="#fffaf0" font-family="Georgia, serif" font-size="32" font-weight="700">Protection and release can oppose each other</text>
  <text x="54" y="123" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="14">A(c)/N = S(c) R(c); R is conditional on transit survival</text>

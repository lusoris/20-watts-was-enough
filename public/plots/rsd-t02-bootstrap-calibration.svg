<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Bootstrap diagnostics block the current power plan</title>
  <desc id="desc">Deterministic public synthetic method diagnostic generated by running every declared transcript scenario through the exact executable bootstrap/Holm analyzer. The left panel shows observed any-rejection frequency and Wilson Monte Carlo intervals for the null and minimum-relevant-effect scenarios against their declared 0.05 and illustrative 0.90 references. The null interval spans 0.05, while the alternative is far below 0.90. The right panel shows the fraction of replicates that fail bootstrap resolution in the two small-n hostile scenarios. These are not scientific power estimates, model measurements, effect estimates, confirmation evidence, or a frozen sample-size plan; every report remains NO_RESULT.</desc>

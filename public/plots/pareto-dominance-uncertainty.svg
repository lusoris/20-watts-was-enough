  <line x1="92" y1="488.1" x2="842" y2="488.1" stroke="#1d6f9b" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="532" y="178" fill="#1d6f9b" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="end">minimum energy effect</text>
  <text x="830" y="478.1" fill="#1d6f9b" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="end">quality non-inferiority</text>
  <text x="110" y="182" fill="#146c43" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">REGION CAN SUPPORT PROMOTION</text>

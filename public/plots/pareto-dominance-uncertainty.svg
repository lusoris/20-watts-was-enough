<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc" data-layout="quadrant-gates" data-theme="paper">
  <title id="title">A mean improvement is not a promotion decision</title>
  <desc id="desc">Illustrative simultaneous decision regions and hard-gate states; no point or interval is a measured system result.</desc>
  <rect width="1180" height="760" fill="#f4efe3"/>
  <rect x="54" y="26" width="263.59999999999997" height="28" rx="14" fill="#e9eee7" stroke="#146c43"/>
  <text x="70" y="45" fill="#146c43" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.1">SIMULTANEOUS DECISION REGION</text>
  <text x="54" y="78" fill="#10281a" font-family="Georgia, serif" font-size="30" font-weight="700">A mean improvement is not a promotion decision</text>
  <text x="54" y="112" fill="#53655a" font-family="Cascadia Mono, monospace" font-size="13">d = (e_C - e_B) / e_B;  Delta Q = Q_C - Q_B</text>
  <text x="1138" y="45" fill="#53655a" font-family="Cascadia Mono, monospace" font-size="11" text-anchor="end">quadrant-gates · no measurements</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="840" viewBox="0 0 1180 840" role="img" aria-labelledby="title desc" data-layout="family-property-overlap" data-theme="violet">
  <title id="title">Generator family is not the property vector</title>
  <desc id="desc">Conceptual schema for the RSD-T01 target correction. System symmetry is classified from the maximum discrepancy over the complete registered history × scale grid; endpoint and peak predicates remain per-cell matrices with a frozen all/partial/none reducer. Generator-family identity does not supply the separately evaluated cross-cutting targets; logical dependencies between targets remain. The overlap examples are possibilities, not measurements, frequencies, model outputs, or a fixed family-to-property lookup.</desc>
  <rect width="1180" height="840" fill="#171127"/>
  <rect x="54" y="26" width="329.2" height="28" rx="14" fill="#33244f" stroke="#c4a7ff"/>
  <text x="70" y="45" fill="#c4a7ff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.1">RSD-T01 TARGET CONTRACT · NO RESULTS</text>
  <text x="54" y="78" fill="#fffaff" font-family="Georgia, serif" font-size="30" font-weight="700">Generator family is not the property vector</text>
  <text x="54" y="112" fill="#c9bce0" font-family="Cascadia Mono, monospace" font-size="13">D_max = max_(h,p) D_(h,p); target: pi = (S_system, {A_end,h,p}, {E_peak,h,p}, M_causal, Q_membership)</text>
  <text x="1138" y="45" fill="#c9bce0" font-family="Cascadia Mono, monospace" font-size="11" text-anchor="end">family-property-overlap · no measurements</text>

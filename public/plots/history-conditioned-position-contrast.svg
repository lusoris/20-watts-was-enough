<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" role="img" aria-labelledby="title desc" data-layout="position-contrast-interaction" data-theme="violet">
  <title id="title">Hypothetical capacity cut and position contrast</title>
  <desc id="desc">Constructed factorial-design illustration using hypothetical protected-score contrasts. No model was trained: the values are not measurements, estimates, predictions, recommended effect sizes, or evidence for a position or capacity mechanism.</desc>
  <rect width="1180" height="780" fill="#171127"/>
  <rect x="54" y="26" width="271.79999999999995" height="28" rx="14" fill="#33244f" stroke="#c4a7ff"/>
  <text x="70" y="45" fill="#c4a7ff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.1">HYPOTHETICAL FACTORIAL DESIGN</text>
  <text x="54" y="78" fill="#fffaff" font-family="Georgia, serif" font-size="30" font-weight="700">Hypothetical capacity cut and position contrast</text>
  <text x="54" y="112" fill="#c9bce0" font-family="Cascadia Mono, monospace" font-size="13">c_j = η_(a,k,j,q) − mean over positions j′ of η_(a,k,j′,q);  Γ_cap(j) = c_j^reserved − c_j^shared</text>
  <text x="1138" y="45" fill="#c9bce0" font-family="Cascadia Mono, monospace" font-size="11" text-anchor="end">position-contrast-interaction · no measurements</text>
  <text x="54" y="143" fill="#ff718d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="850" letter-spacing=".9">CONSTRUCTED VALUES · NO MODEL TRAINED · NO MEASUREMENTS</text>
  <text x="96" y="184" fill="#fffaff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800">POSITION CONTRAST BY CAPACITY MECHANISM</text>
  <text x="844" y="184" fill="#fffaff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800">RESERVED − SHARED</text>


  <rect x="74" y="632" width="1032" height="91" rx="15" fill="#33244f" stroke="#c4a7ff" stroke-width="2"/>
  <text x="94" y="659" fill="#c4a7ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="850" letter-spacing=".7">HYPOTHETICAL FACTORIAL-DESIGN ILLUSTRATION · NO MEASUREMENTS</text>
  <text x="94" y="683" fill="#fffaff" font-family="Segoe UI, sans-serif" font-size="13">The constructed reservation cut attenuates the early-position advantage and late-position penalty.</text>
  <text x="94" y="706" fill="#c9bce0" font-family="Segoe UI, sans-serif" font-size="12">A real run fixes presented tasks, eligible module IDs, exogenous exposure, capacity, optimizer, evaluator and budget.</text>
  <text x="1138" y="761" fill="#c9bce0" font-family="Cascadia Mono, monospace" font-size="10" text-anchor="end">hypothetical percentage-point contrasts · not evidence or an effect-size target</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Layout selection can manufacture a speedup</title>
  <desc id="desc">Noise-free synthetic expectations generated from the Fixture 012 smoke configuration; this is a design diagnostic, not an empirical performance result.</desc>
  <rect width="1100" height="660" rx="24" fill="#101c18"/>
  <rect x="36" y="30" width="314" height="30" rx="15" fill="#203b31" stroke="#3f6b5b"/>
  <text x="52" y="50" fill="#36d399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SYNTHETIC FIXTURE · ANALYTICAL</text>
  <text x="54" y="94" fill="#fffaf0" font-family="Georgia, serif" font-size="32" font-weight="700">Layout selection can manufacture a speedup</text>
  <text x="54" y="123" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="14">s = (mean Y_baseline - mean Y_candidate) / mean Y_baseline</text>
  <rect x="112" y="150" width="928" height="406" rx="8" fill="#14251f" stroke="#315047"/>
  <line x1="474" y1="194" x2="474" y2="526" stroke="#315047" stroke-width="1" opacity=".8"/><text x="474" y="550" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="12" text-anchor="middle">0%</text><line x1="607.5" y1="194" x2="607.5" y2="526" stroke="#315047" stroke-width="1" opacity=".8"/><text x="607.5" y="550" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="12" text-anchor="middle">2%</text><line x1="741" y1="194" x2="741" y2="526" stroke="#315047" stroke-width="1" opacity=".8"/><text x="741" y="550" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="12" text-anchor="middle">4%</text><line x1="874.5" y1="194" x2="874.5" y2="526" stroke="#315047" stroke-width="1" opacity=".8"/><text x="874.5" y="550" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="12" text-anchor="middle">6%</text><line x1="1008" y1="194" x2="1008" y2="526" stroke="#315047" stroke-width="1" opacity=".8"/><text x="1008" y="550" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="12" text-anchor="middle">8%</text>
  <line x1="474" y1="186" x2="474" y2="526" stroke="#fffaf0" stroke-width="3"/>
  <text x="474" y="174" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">no speedup</text>
  <text x="138" y="244" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Fixed favorable layout</text>
      <text x="138" y="268" fill="#aabbb4" font-family="Segoe UI, sans-serif" font-size="12">layout 0 repeated · 8 equal-budget slots</text>
      <line x1="474" y1="252" x2="976.4193548387098" y2="252" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" opacity=".65"/>
      <circle cx="976.4193548387098" cy="252" r="10" fill="#ff6b6b" stroke="#fffaf0" stroke-width="2"/>
      <text x="994.4193548387098" y="240" fill="#ff6b6b" font-family="Cascadia Mono, monospace" font-size="17" font-weight="700" text-anchor="end">7.53%</text>
      <text x="994.4193548387098" y="270" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="11" text-anchor="end">0.930 → 0.860 ms · false speedup</text><text x="138" y="354" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Complete layout population</text>
      <text x="138" y="378" fill="#aabbb4" font-family="Segoe UI, sans-serif" font-size="12">8 layouts · counterbalanced order</text>
      <line x1="474" y1="362" x2="474" y2="362" stroke="#36d399" stroke-width="8" stroke-linecap="round" opacity=".65"/>
      <circle cx="474" cy="362" r="10" fill="#36d399" stroke="#fffaf0" stroke-width="2"/>
      <text x="492" y="350" fill="#36d399" font-family="Cascadia Mono, monospace" font-size="17" font-weight="700" text-anchor="start">0.00%</text>
      <text x="492" y="380" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="11" text-anchor="start">1.005 → 1.005 ms · population null</text><text x="138" y="464" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Operator-qualified parity</text>
      <text x="138" y="488" fill="#aabbb4" font-family="Segoe UI, sans-serif" font-size="12">identical mature payload and budget</text>
      <line x1="474" y1="472" x2="474" y2="472" stroke="#45b7d1" stroke-width="8" stroke-linecap="round" opacity=".65"/>
      <circle cx="474" cy="472" r="10" fill="#45b7d1" stroke="#fffaf0" stroke-width="2"/>
      <text x="492" y="460" fill="#45b7d1" font-family="Cascadia Mono, monospace" font-size="17" font-weight="700" text-anchor="start">0.00%</text>
      <text x="492" y="490" fill="#aabbb4" font-family="Cascadia Mono, monospace" font-size="11" text-anchor="start">1.005 → 1.005 ms · exact parity</text>
  <rect x="138" y="506" width="302" height="30" rx="15" fill="#203b31" stroke="#3f6b5b"/>
  <text x="289" y="526" fill="#ffb04a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">synthetic mean latency: baseline → candidate</text>
  <text x="576" y="617" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">apparent candidate mean-latency reduction (%)</text>
  <text x="28" y="353" fill="#fffaf0" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle" transform="rotate(-90 28 353)">evaluation design</text>
  <text x="1040" y="638" fill="#aabbb4" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">experiments/workstation/fixture-012/configs/smoke.json · noise disabled · no measured runtime</text>
</svg>
